apiVersion: v2
name: agentic-qa
description: Production Agentic QA Service with RAG Architecture - AI Engineer Assessment
type: application
version: 1.0.0
appVersion: "1.0.0"

keywords:
  - ai
  - agentic
  - rag
  - fastapi
  - python
  - kubernetes
  - deployment

home: https://github.com/muhammadfawad538/Multitenant-Rag-Agent-Assessment
sources:
  - https://github.com/muhammadfawad538/Multitenant-Rag-Agent-Assessment

maintainers:
  - name: Assessment Candidate
    email: candidate@example.com
    url: https://github.com/muhammadfawad538

dependencies:
  - name: redis
    version: "~18.0.0"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled
    tags:
      - cache
  - name: postgresql
    version: "~13.0.0"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
    tags:
      - database
  - name: qdrant
    version: "~0.14.0"
    repository: "https://helm.qdrant.io"
    condition: qdrant.enabled
    tags:
      - vector-database

annotations:
  ai-engineer-assessment: "true"
  architecture: "multitenant-rag-agentic"
  deployment: "production-ready"
  caching: "tiered-strategy"
  observability: "built-in"