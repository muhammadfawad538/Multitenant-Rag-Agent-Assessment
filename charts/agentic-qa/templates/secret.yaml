apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agentic-qa.fullname" . }}-secrets
  labels:
    {{- include "agentic-qa.labels" . | nindent 4 }}
    secret-type: "application"
type: Opaque
data:
  # Google Gemini API Key (base64 encoded)
  # To create: echo -n "your-api-key" | base64
  google-api-key: {{ .Values.env.GOOGLE_API_KEY | b64enc | quote }}

  # Redis password (if enabled)
  {{- if .Values.redis.enabled }}
  redis-password: {{ .Values.redis.auth.password | b64enc | quote }}
  {{- end }}

  # PostgreSQL credentials (if enabled)
  {{- if .Values.postgresql.enabled }}
  postgresql-password: {{ .Values.postgresql.auth.password | b64enc | quote }}
  postgresql-username: {{ .Values.postgresql.auth.username | b64enc | quote }}
  postgresql-database: {{ .Values.postgresql.auth.database | b64enc | quote }}
  {{- end }}

  # Qdrant API key (if enabled)
  {{- if .Values.qdrant.enabled }}
  qdrant-api-key: {{ "" | b64enc | quote }}  # Placeholder for future
  {{- end }}

  # Additional application secrets
  # Add any other secrets needed for the application
  # app-secret-key: {{ "" | b64enc | quote }}

---
# Service account token secret (if using external services)
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agentic-qa.fullname" . }}-service-account-token
  annotations:
    kubernetes.io/service-account.name: {{ include "agentic-qa.serviceAccountName" . }}
  labels:
    {{- include "agentic-qa.labels" . | nindent 4 }}
    secret-type: "service-account"
type: kubernetes.io/service-account-token
{{- end }}

---
# TLS secret for ingress (if enabled with TLS)
{{- if and .Values.ingress.enabled .Values.ingress.tls }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agentic-qa.fullname" . }}-tls
  labels:
    {{- include "agentic-qa.labels" . | nindent 4 }}
    secret-type: "tls"
type: kubernetes.io/tls
data:
  # To create: kubectl create secret tls agentic-qa-tls --cert=path/to/tls.crt --key=path/to/tls.key
  tls.crt: {{ "" | b64enc | quote }}
  tls.key: {{ "" | b64enc | quote }}
{{- end }}