# Default values for agentic-qa
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Deployment configuration
replicaCount: 2

# Image configuration
image:
  repository: agentic-qa-service
  tag: latest
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  # tag: ""

# Name override for the deployment
nameOverride: ""
fullnameOverride: ""

# Service configuration
service:
  type: ClusterIP
  port: 8000
  annotations: {}
  # LoadBalancer specific configurations
  # loadBalancerIP: ""
  # loadBalancerSourceRanges: []
  # externalTrafficPolicy: ""

# Ingress configuration for external access
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: agentic-qa.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: agentic-qa-tls
  #    hosts:
  #      - agentic-qa.local

# Resource configuration
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

# Autoscaling configuration
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# Environment variables for the application
env:
  # Required: Google Gemini API Key (should be provided via secret)
  GOOGLE_API_KEY: ""
  # Application configuration
  PORT: "8000"
  HOST: "0.0.0.0"
  ALLOWED_DOMAINS: "duckduckgo.com,wikipedia.org,weather.com"
  # Logging configuration
  LOG_LEVEL: "INFO"
  # Performance tuning
  MAX_WORKERS: "4"
  REQUEST_TIMEOUT: "30"

# Additional environment variables (key-value pairs)
extraEnv: {}
  # EXAMPLE_VARIABLE: "value"

# Additional environment variables from ConfigMaps
extraEnvFromConfigMaps: []
  # - configMapRef:
  #     name: app-config

# Additional environment variables from Secrets
extraEnvFromSecrets: []
  # - secretRef:
  #     name: app-secrets

# Pod annotations
podAnnotations: {}
  # prometheus.io/scrape: "true"
  # prometheus.io/port: "8000"

# Pod security context
podSecurityContext:
  fsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000

# Security context
securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

# Node selector
nodeSelector: {}

# Affinity configuration
affinity: {}

# Tolerations
tolerations: []

# Topology spread constraints
topologySpreadConstraints: []

# Service account configuration
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Pod disruption budget
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  maxUnavailable: "50%"

# Liveness and readiness probes
probes:
  liveness:
    path: /health
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 3
  readiness:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    successThreshold: 1
    failureThreshold: 3

# Redis cache configuration (for tiered caching strategy)
redis:
  enabled: false
  # Redis configuration for prompt caching
  architecture: standalone
  auth:
    enabled: false
  replicaCount: 1
  resources:
    requests:
      memory: 256Mi
      cpu: 250m

# PostgreSQL configuration (for metadata storage)
postgresql:
  enabled: false
  # PostgreSQL for audit logging and metadata
  auth:
    username: agentic
    password: ""
    database: agentic_db
  primary:
    persistence:
      enabled: true
      size: 8Gi

# Qdrant vector database configuration (for RAG implementation)
qdrant:
  enabled: false
  # Vector database for semantic search
  replicaCount: 1
  resources:
    requests:
      memory: 1Gi
      cpu: 500m
  persistence:
    enabled: true
    size: 10Gi

# Prometheus metrics configuration
metrics:
  enabled: false
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s

# Network policies
networkPolicy:
  enabled: false
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: agentic-qa
      ports:
        - port: 8000
          protocol: TCP